<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header, section, footer {
      padding: 20px;
      text-align: center;
    }
    header {
      background-color: #333;
      color: #fff;
    }
    section {
      background-color: #f9f9f9;
      color: #333;
    }
    footer {
      background-color: #222;
      color: #eee;
      font-size: 0.9em;
    }
    a {
      color: #00f;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#about">About</a> |
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="about">
    <h2>About</h2>
    <p>This is a simple section with some text.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: <a href="mailto:example@example.com">example@example.com</a></p>
  </section>

  <footer>
    <p>© 2026 My Website</p>
  </footer>

</body>
</html>
