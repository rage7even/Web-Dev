<div class="product-container">
<div class="product-image">
  <img [src]="selectedImage" [alt]="product.name" class="main-image">
  <!-- Миниатюры -->
  <div class="thumbnail-container" *ngIf="product.images.length > 1">
    <img *ngFor="let img of product.images; let i = index"
         [src]="img"
         [alt]="product.name + ' ' + i"
         (click)="selectedImage = img"
         [class.active]="selectedImage === img"
         class="thumbnail">
  </div>
</div>
  <div class="product-info">
    <h3 class="product-title">{{ product.name }}</h3>
    <p class="product-description">{{ product.description }}</p>
    <div class="product-rating">
      <!-- Звёзды -->
      <span *ngFor="let _ of [].constructor(stars.fullStars); let i = index" class="star filled">★</span>
      <span *ngIf="stars.halfStar" class="star half">★</span>
      <span *ngFor="let _ of [].constructor(stars.emptyStars); let i = index" class="star empty">★</span>
      <span class="rating-value">{{ product.rating }}</span>
    </div>
    <div class="product-price">{{ product.price | number }} ₸</div>
    <div class="product-actions">
      <a [href]="product.link" target="_blank" class="btn btn-primary">Смотреть на Kaspi.kz</a>
      <button class="btn btn-share" (click)="shareViaWhatsApp()">WhatsApp</button>
      <button class="btn btn-share" (click)="shareViaTelegram()">Telegram</button>
    </div>
  </div>
</div>
