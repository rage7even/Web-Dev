
<div class="container">
  @if (products.length > 0) {
    <div class="products-grid">
      @for (product of products; track product.id) {
        <app-product-item 
          [product]="product" 
          (like)="onLike(product.id)" 
          (delete)="onDelete(product.id)">
        </app-product-item>
      }
    </div>
  } @else {
    <div class="empty-message">
      <p>В этой категории нет товаров</p>
    </div>
  }
</div>
