<div class="product-card">
  <div class="product-image">
    <!-- Основное изображение с кнопками навигации -->
    <div class="main-image-container">
      <button class="nav-btn prev" (click)="prevImage()" [disabled]="!product.images || product.images.length <= 1">‹</button>
      <img [src]="selectedImage" [alt]="product.name" class="main-image">
      <button class="nav-btn next" (click)="nextImage()" [disabled]="!product.images || product.images.length <= 1">›</button>
    </div>

    <!-- Миниатюры -->
    <div class="thumbnail-container" *ngIf="product.images && product.images.length > 1">
      <img *ngFor="let img of product.images; let i = index"
           [src]="img"
           [alt]="product.name + ' ' + i"
           (click)="selectImage(img)"
           [class.active]="selectedImage === img"
           class="thumbnail">
    </div>
  </div>

  <div class="product-info">
    <h3 class="product-title">{{ product.name }}</h3>
    <p class="product-description">{{ product.description }}</p>

    <!-- Рейтинг -->
    <div class="product-rating">
      <span *ngFor="let _ of [].constructor(stars.fullStars); let i = index" class="star filled">★</span>
      <span *ngIf="stars.halfStar" class="star half">★</span>
      <span *ngFor="let _ of [].constructor(stars.emptyStars); let i = index" class="star empty">★</span>
      <span class="rating-value">{{ product.rating }}</span>
    </div>

    <div class="product-price">{{ product.price | number }} ₸</div>

    <!-- Кнопки действий -->
    <div class="product-actions">
      <button class="btn btn-like" (click)="onLike()">❤️ {{ product.likes }}</button>
      <button class="btn btn-delete" (click)="onDelete()">🗑️ Удалить</button>
      <button class="btn btn-share" (click)="shareViaWhatsApp()">WhatsApp</button>
      <button class="btn btn-share" (click)="shareViaTelegram()">Telegram</button>
      <a [href]="product.link" target="_blank" class="btn btn-primary">Kaspi.kz</a>
    </div>
  </div>
</div>
