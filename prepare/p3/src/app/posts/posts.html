<h2>Posts</h2>

@if (loading()) {
  <p>Posts are loading...</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  <p>{{ posts().length }} posts loaded</p>
  <ul>
    @for (post of posts(); track post.id) {
      <li>
        <strong>{{ post.title }}</strong> - {{ post.body }}
      </li>
    } @empty {
      <li>No posts found.</li>
    }
  </ul>
}
