<div class="product-card">
  <img [src]="image()" [alt]="name()" class="product-image">
  <h3> {{name()}}</h3>
  <p>Price: {{ price() | currency }}</p>

  <p>Status:  {{ isNew ? 'New' : 'Regular' }}</p>
  <p>Alive for: {{ timer }}</p>

  <button (click)="onDelete()">Delete</button>

  <button (click)="onLike()">Like: {{likesCnt}}</button>
</div>
