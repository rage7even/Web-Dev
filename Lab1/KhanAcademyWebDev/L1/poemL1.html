        <title>Challenge: Write a Poem</title>
        <meta charset="utf-8">
    </head>
    <body>
    <h1>Poem: Whisper of Dawn</h1>
    <p>The night exhales its silver sigh, 
    <br>A blush of gold warms up the sky.
    <br>Each ray a promise, soft and new—
    <br>The world awakes, and so do you.
    </p>
    </body>
</html>
