<div class="movie-card" [ngClass]="movie.isWatched ? 'wathced' : 'not-watched'">
  <div class="header">
    <h2> {{movie.title}}</h2>
    <span> {{movie.year}}</span>
  </div>

  <div class="status">
    <span *ngIf="movie.isWatched; else notWathced" class="badge notWathced">
      Wathced
    </span>
    <ng-template #notWatched><span class="badge not-watched-badge">
      Not-wathced
    </span></ng-template>
  </div>

  <div class="controls">
    <button (click)="upvote()"> {{ movie.votes}}</button>
    <button (click)="onRemove()">Remove</button>
  </div>
</div>
