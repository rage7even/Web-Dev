<section>
  @if (isLoading) {
    <p class="loading">Loading post details...</p>
  } @else if (post) {
    <div class="detail-card">
      <p class="meta">Post ID: {{ post.id }} | User ID: {{ post.userId }}</p>
      <h2>{{ post.title }}</h2>
      <p class="body">{{ post.body }}</p>

      <button class="back-btn" (click)="goBack()">Back to Posts</button>
    </div>
  } @else {
    <p>Post not found.</p>
  }
</section>
