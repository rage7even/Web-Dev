<section>
  <h2>Posts list</h2>

  @if (isLoading) {
    <p class="loading">Loading posts... </p>
  } @else {
    <div class="posts-grid">
      @for (post of posts; track post.id) {
        <div (click)="openPost(post.id)">
          <h3> {{ truncateTitle(post.title)}}</h3>
          <p> PostID: {{ post.id}}</p>
          <p>User Id {{post.userId }}</p>

        </div>
      }
    </div>
  }
</section>
